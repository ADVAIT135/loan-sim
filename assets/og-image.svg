<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5a4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <g transform="translate(60,80)">
    <rect x="0" y="0" width="1080" height="470" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" />

    <g transform="translate(36,36)">
      <text x="0" y="60" font-family="Inter, Arial, sans-serif" font-size="48" fill="#ffffff" font-weight="700">Loan Decision Simulator</text>
      <text x="0" y="110" font-family="Inter, Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.9)">Hybrid rules + explainable ML</text>

      <g transform="translate(0,150)">
        <rect x="0" y="0" width="440" height="160" rx="12" fill="#fff" fill-opacity="0.06" stroke="rgba(255,255,255,0.06)" filter="url(#f)"/>
        <text x="24" y="44" font-family="Inter, Arial, sans-serif" font-size="28" fill="#fff" font-weight="600">Decisions</text>
        <text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">Explainable probabilities, rule triggers, and audit logs</text>

        <g transform="translate(24,108)">
          <rect x="0" y="0" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
          <rect x="0" y="0" width="132" height="10" rx="5" fill="#0ea5a4"/>
          <text x="236" y="9" font-family="Inter, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">Model score: 0.60 (manual review)</text>
        </g>
      </g>

      <g transform="translate(520,150)">
        <rect x="0" y="0" width="480" height="160" rx="12" fill="#fff" fill-opacity="0.04" stroke="rgba(255,255,255,0.06)"/>
        <text x="24" y="44" font-family="Inter, Arial, sans-serif" font-size="28" fill="#fff" font-weight="600">Audit &amp; Trace</text>
        <text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">Immutable decision logs, developer-friendly API</text>
      </g>

      <text x="0" y="360" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.75)">Built by Advait Gurunath Chavan — https://github.com/ADVAIT135</text>
    </g>
  </g>
</svg>
